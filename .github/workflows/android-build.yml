name: Build Android APK and Core

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'cmd/**'
      - 'internal/**'
      - 'sdk/**'
      - 'scripts/android/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/upstream-version'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'cmd/**'
      - 'internal/**'
      - 'sdk/**'
      - 'scripts/android/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/upstream-version'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK & Native Core
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Compile Native Core (libcliproxy.so & CLI)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86_64
          mkdir -p dist/android/arm64-v8a
          mkdir -p dist/android/x86_64

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          echo "Compiling arm64-v8a..."
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          CC="$TOOLCHAIN/bin/aarch64-linux-android26-clang" \
          CXX="$TOOLCHAIN/bin/aarch64-linux-android26-clang++" \
          go build -buildmode=c-shared -trimpath \
            -ldflags="-s -w -extldflags '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'" \
            -o android/app/src/main/jniLibs/arm64-v8a/libcliproxy.so ./cmd/mobile
          rm -f android/app/src/main/jniLibs/arm64-v8a/libcliproxy.h

          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          CC="$TOOLCHAIN/bin/aarch64-linux-android26-clang" \
          CXX="$TOOLCHAIN/bin/aarch64-linux-android26-clang++" \
          go build -buildmode=pie -trimpath \
            -ldflags="-s -w -extldflags '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'" \
            -o dist/android/arm64-v8a/cli-proxy-api ./cmd/server

          echo "Compiling x86_64..."
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
          CC="$TOOLCHAIN/bin/x86_64-linux-android26-clang" \
          CXX="$TOOLCHAIN/bin/x86_64-linux-android26-clang++" \
          go build -buildmode=c-shared -trimpath \
            -ldflags="-s -w -extldflags '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'" \
            -o android/app/src/main/jniLibs/x86_64/libcliproxy.so ./cmd/mobile
          rm -f android/app/src/main/jniLibs/x86_64/libcliproxy.h

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          core_version="$(tr -d '[:space:]' < ../.github/upstream-version)"
          ./gradlew assembleDebug -PcoreVersion="${core_version#v}"

      - name: Upload APK & CLI Binary Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliproxy-android-artifacts
          path: |
            android/app/build/outputs/apk/debug/*.apk
            dist/android/arm64-v8a/cli-proxy-api
