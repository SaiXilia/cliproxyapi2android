name: Release Signed Android Update

on:
  workflow_call:
    inputs:
      app_version:
        description: 'Android app version, for example 1.1.2'
        required: true
        type: string
      source_ref:
        description: 'Integrated source commit produced by the upstream sync workflow'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Android app version to publish, for example 1.1.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-signed-android-${{ inputs.app_version }}-${{ inputs.source_ref || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integrated source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || 'main' }}

      - name: Record manually selected app version
        if: inputs.source_ref == ''
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported Android app version: $APP_VERSION" >&2
            exit 1
          fi

          current_version="$(sed -n 's/^appVersionName=//p' android/gradle.properties | tail -n 1 | tr -d '[:space:]')"
          if [[ "$current_version" == "$APP_VERSION" ]]; then
            exit 0
          fi

          sed -i "s/^appVersionName=.*/appVersionName=$APP_VERSION/" android/gradle.properties
          sed -i -E "s/(appVersionNameValue = providers\.gradleProperty\(\"appVersionName\"\)\.orNull \?: )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"$APP_VERSION\"/" android/app/build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle.properties android/app/build.gradle.kts
          git commit -m "chore(android): set app version $APP_VERSION"
          git push origin HEAD:main

      - name: Resolve version metadata
        id: version
        env:
          REQUESTED_APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          integrated_tag="$(tr -d '[:space:]' < .github/upstream-version)"
          if [[ ! "$integrated_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported integrated core version: $integrated_tag" >&2
            exit 1
          fi
          core_tag="$integrated_tag"
          core_version="${core_tag#v}"

          app_version="$(sed -n 's/^appVersionName=//p' android/gradle.properties | tail -n 1 | tr -d '[:space:]')"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported Android app version: $app_version" >&2
            exit 1
          fi
          if [[ "$app_version" != "$REQUESTED_APP_VERSION" ]]; then
            echo "Requested app version $REQUESTED_APP_VERSION does not match source version $app_version" >&2
            exit 1
          fi

          release_tag="android-v$app_version-core.$core_version"
          source_commit="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_commit" != "$source_commit" ]]; then
              echo "Release tag $release_tag already points to a different source commit" >&2
              exit 1
            fi
          fi
          version_code=$((10000000 + $(git rev-list --count HEAD)))
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo "Android version code is out of range: $version_code" >&2
            exit 1
          fi
          version_name="$app_version-core.$core_version"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android release signing secrets are not configured" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/cliproxy-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "CLIPROXY_SIGNING_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          echo "CLIPROXY_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CLIPROXY_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CLIPROXY_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify Go server build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output

      - name: Compile Android proxy core
        env:
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86_64
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="$(git rev-parse --short HEAD)"
          ldflags="-s -w -X github.com/router-for-me/CLIProxyAPI/v8/internal/buildinfo.Version=$CORE_VERSION -X github.com/router-for-me/CLIProxyAPI/v8/internal/buildinfo.Commit=$commit -X github.com/router-for-me/CLIProxyAPI/v8/internal/buildinfo.BuildDate=$build_date -extldflags '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'"

          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          CC="$toolchain/bin/aarch64-linux-android26-clang" \
          CXX="$toolchain/bin/aarch64-linux-android26-clang++" \
          go build -buildmode=c-shared -trimpath -ldflags="$ldflags" \
            -o android/app/src/main/jniLibs/arm64-v8a/libcliproxy.so ./cmd/mobile
          rm -f android/app/src/main/jniLibs/arm64-v8a/libcliproxy.h

          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
          CC="$toolchain/bin/x86_64-linux-android26-clang" \
          CXX="$toolchain/bin/x86_64-linux-android26-clang++" \
          go build -buildmode=c-shared -trimpath -ldflags="$ldflags" \
            -o android/app/src/main/jniLibs/x86_64/libcliproxy.so ./cmd/mobile
          rm -f android/app/src/main/jniLibs/x86_64/libcliproxy.h

      - name: Build signed release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PrequireReleaseSigning=true \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" \
            -PcoreVersion="$CORE_VERSION"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare update manifest and checksums
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_name="CLIProxyAPI-Android-$RELEASE_TAG.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/$apk_name"
          apk_sha256="$(sha256sum "release-assets/$apk_name" | awk '{print $1}')"
          export APK_NAME="$apk_name" APK_SHA256="$apk_sha256"
          python3 - <<'PY'
          import json
          import os

          manifest = {
              "schema_version": 1,
              "version_code": int(os.environ["VERSION_CODE"]),
              "version_name": os.environ["VERSION_NAME"],
              "core_version": os.environ["CORE_VERSION"],
              "package_name": "com.cliproxy",
              "apk_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                  f"{os.environ['RELEASE_TAG']}/{os.environ['APK_NAME']}"
              ),
              "sha256": os.environ["APK_SHA256"],
              "release_notes": (
                  f"Android app {os.environ['APP_VERSION']}; "
                  f"CLIProxyAPI core {os.environ['CORE_VERSION']}"
              ),
          }
          with open("release-assets/update.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, ensure_ascii=False, indent=2)
              output.write("\n")
          PY
          (
            cd release-assets
            sha256sum "$apk_name" update.json > checksums.txt
          )

      - name: Create unified release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "CLIProxyAPI Android $VERSION_NAME"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: CLIProxyAPI Android ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Android application update built from the official router-for-me/CLIProxyAPI stable release.

            - App version: `${{ steps.version.outputs.version_name }}`
            - Proxy core: `${{ steps.version.outputs.core_version }}`
            - Android version code: `${{ steps.version.outputs.version_code }}`

            The APK includes both arm64-v8a and x86_64 native cores. Existing settings and OAuth data are preserved during a normal signed update.
          files: |
            release-assets/*
