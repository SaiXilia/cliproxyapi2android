name: Sync Stable Upstream Core

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional upstream release tag, for example v8.0.3'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-stable-upstream-core
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare latest stable CLIProxyAPI release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      publish: ${{ steps.sync.outputs.publish }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
      source_ref: ${{ steps.sync.outputs.source_ref }}
      app_version: ${{ steps.sync.outputs.app_version }}
      core_version: ${{ steps.sync.outputs.core_version }}

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream releases
        run: |
          cp scripts/android/clean_sponsors.py "$RUNNER_TEMP/clean_sponsors.py"
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git 2>/dev/null || true
          git fetch --force upstream main --tags

      - name: Resolve and prepare stable release
        id: sync
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_TAG" ]]; then
            upstream_tag="$REQUESTED_TAG"
          else
            upstream_tag="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/router-for-me/CLIProxyAPI/releases/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          fi

          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported upstream release tag: $upstream_tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$upstream_tag" >/dev/null

          current_tag="$(tr -d '[:space:]' < .github/upstream-version)"
          app_version="$(sed -n 's/^appVersionName=//p' android/gradle.properties | tail -n 1 | tr -d '[:space:]')"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported Android app version: $app_version" >&2
            exit 1
          fi
          core_version="${upstream_tag#v}"
          release_tag="$app_version-core.$core_version"
          if [[ "$current_tag" == "$upstream_tag" ]]; then
            echo "CLIProxyAPI $upstream_tag is already integrated"
            release_json="$RUNNER_TEMP/android-release.json"
            update_json="$RUNNER_TEMP/android-update.json"
            release_ready=false
            if curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
              -o "$release_json"; then
              update_url="$(RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as release_file:
              release = json.load(release_file)
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit(1)
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          if "update.json" not in assets or assets["update.json"].get("size", 0) <= 0:
              raise SystemExit(1)
          if "checksums.txt" not in assets or assets["checksums.txt"].get("size", 0) <= 0:
              raise SystemExit(1)
          if not any(name.endswith(".apk") and asset.get("size", 0) > 0 for name, asset in assets.items()):
              raise SystemExit(1)
          print(assets["update.json"]["url"])
          PY
              )"
              if [[ -n "$update_url" ]] && curl --fail --silent --show-error --location \
                -H "Accept: application/octet-stream" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$update_url" -o "$update_json"; then
                if UPDATE_JSON="$update_json" APP_VERSION="$app_version" CORE_VERSION="$core_version" python3 - <<'PY'
          import json
          import os

          with open(os.environ["UPDATE_JSON"], encoding="utf-8") as update_file:
              update = json.load(update_file)
          accepted_names = {
              os.environ["APP_VERSION"],
              f"{os.environ['APP_VERSION']}-core.{os.environ['CORE_VERSION']}",
          }
          if update.get("version_name") not in accepted_names:
              raise SystemExit(1)
          if update.get("core_version") != os.environ["CORE_VERSION"]:
              raise SystemExit(1)
          PY
              then
                release_ready=true
              fi
              fi
            fi

            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [[ "$release_ready" == "true" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $release_tag is missing or incomplete; scheduling a retry"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
            echo "core_version=$core_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify "refs/tags/$current_tag" >/dev/null; then
            echo "Current integrated upstream tag does not exist: $current_tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$current_tag" "$upstream_tag"; then
            echo "Requested upstream tag $upstream_tag is not newer than integrated tag $current_tag" >&2
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff "$upstream_tag"
          merge_exit=$?
          set -e

          if (( merge_exit != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unexpected=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                examples/*|README_JA.md|.github/workflows/agents-md-guard.yml|.github/workflows/auto-retarget-main-pr-to-dev.yml|.github/workflows/docker-image.yml|.github/workflows/pr-path-guard.yml|.github/workflows/pr-test-build.yml|.github/workflows/release.yaml)
                  git rm -f -- "$path"
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Unresolved Android integration conflict: %s\n' "${unexpected[@]}" >&2
              git merge --abort
              exit 1
            fi
          fi

          python3 "$RUNNER_TEMP/clean_sponsors.py"
          rm -f \
            .github/workflows/agents-md-guard.yml \
            .github/workflows/auto-retarget-main-pr-to-dev.yml \
            .github/workflows/docker-image.yml \
            .github/workflows/pr-path-guard.yml \
            .github/workflows/pr-test-build.yml \
            .github/workflows/release.yaml \
            README_JA.md
          printf '%s\n' "$upstream_tag" > .github/upstream-version

          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore(upstream): sync $upstream_tag"
          elif ! git diff --cached --quiet; then
            git commit -m "chore(upstream): record $upstream_tag"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up JDK 17
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        if: steps.sync.outputs.changed == 'true'
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Validate integrated Android source
        if: steps.sync.outputs.changed == 'true'
        env:
          CORE_VERSION: ${{ steps.sync.outputs.core_version }}
          BUILD_EMULATOR: '1'
        run: |
          set -euo pipefail
          go build -o test-output ./cmd/server
          rm -f test-output
          bash scripts/android/build_android.sh
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp dist/android/arm64-v8a/libcliproxy.so android/app/src/main/jniLibs/arm64-v8a/libcliproxy.so
          cp dist/android/x86_64/libcliproxy.so android/app/src/main/jniLibs/x86_64/libcliproxy.so
          (
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug -PcoreVersion="$CORE_VERSION"
          )

      - name: Publish integrated source
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin HEAD:main

  release:
    name: Build signed Android update
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    uses: ./.github/workflows/android-release.yml
    with:
      app_version: ${{ needs.sync.outputs.app_version }}
      source_ref: ${{ needs.sync.outputs.source_ref }}
    secrets: inherit
