name: Sync Stable Upstream Core

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional upstream release tag, for example v8.0.3'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-stable-upstream-core
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare latest stable CLIProxyAPI release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      publish: ${{ steps.sync.outputs.publish }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
      source_ref: ${{ steps.sync.outputs.source_ref }}

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream releases
        run: |
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git 2>/dev/null || true
          git fetch --force upstream main --tags

      - name: Resolve and prepare stable release
        id: sync
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_TAG" ]]; then
            upstream_tag="$REQUESTED_TAG"
          else
            upstream_tag="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/router-for-me/CLIProxyAPI/releases/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          fi

          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported upstream release tag: $upstream_tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$upstream_tag" >/dev/null

          current_tag="$(tr -d '[:space:]' < .github/upstream-version)"
          release_tag="android-core-$upstream_tag"
          if [[ "$current_tag" == "$upstream_tag" ]]; then
            echo "CLIProxyAPI $upstream_tag is already integrated"
            if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
              git tag -a "$release_tag" -m "Android build for CLIProxyAPI $upstream_tag"
              git push origin "$release_tag"
            fi

            release_json="$RUNNER_TEMP/android-release.json"
            release_ready=false
            if curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              -o "$release_json"; then
              if RELEASE_JSON="$release_json" RELEASE_TAG="$release_tag" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RELEASE_JSON"], encoding="utf-8") as release_file:
              release = json.load(release_file)
          release_tag = os.environ["RELEASE_TAG"]
          expected_assets = {
              f"CLIProxyAPI-Android-{release_tag}.apk",
              "checksums.txt",
              "update.json",
          }
          actual_assets = {
              asset["name"]: asset.get("size", 0)
              for asset in release.get("assets", [])
          }
          if (
              release.get("draft")
              or release.get("prerelease")
              or not expected_assets.issubset(actual_assets)
              or any(actual_assets[name] <= 0 for name in expected_assets)
          ):
              raise SystemExit(1)
          PY
              then
                release_ready=true
              fi
            fi

            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [[ "$release_ready" == "true" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $release_tag is missing or incomplete; scheduling a retry"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "source_ref=$release_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Release tag already exists before $upstream_tag is integrated: $release_tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$current_tag" >/dev/null; then
            echo "Current integrated upstream tag does not exist: $current_tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$current_tag" "$upstream_tag"; then
            echo "Requested upstream tag $upstream_tag is not newer than integrated tag $current_tag" >&2
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff "$upstream_tag"
          merge_exit=$?
          set -e

          if (( merge_exit != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unexpected=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                examples/*|README_JA.md|.github/workflows/agents-md-guard.yml|.github/workflows/auto-retarget-main-pr-to-dev.yml|.github/workflows/docker-image.yml|.github/workflows/pr-path-guard.yml|.github/workflows/pr-test-build.yml|.github/workflows/release.yaml)
                  git rm -f -- "$path"
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Unresolved Android integration conflict: %s\n' "${unexpected[@]}" >&2
              git merge --abort
              exit 1
            fi
          fi

          python3 scripts/android/clean_sponsors.py
          rm -f \
            .github/workflows/agents-md-guard.yml \
            .github/workflows/auto-retarget-main-pr-to-dev.yml \
            .github/workflows/docker-image.yml \
            .github/workflows/pr-path-guard.yml \
            .github/workflows/pr-test-build.yml \
            .github/workflows/release.yaml \
            README_JA.md
          printf '%s\n' "$upstream_tag" > .github/upstream-version

          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore(upstream): sync $upstream_tag"
          elif ! git diff --cached --quiet; then
            git commit -m "chore(upstream): record $upstream_tag"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up JDK 17
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        if: steps.sync.outputs.changed == 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Validate integrated Android source
        if: steps.sync.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.sync.outputs.release_tag }}
          BUILD_EMULATOR: '1'
        run: |
          set -euo pipefail
          go build -o test-output ./cmd/server
          rm -f test-output
          bash scripts/android/build_android.sh
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp dist/android/arm64-v8a/libcliproxy.so android/app/src/main/jniLibs/arm64-v8a/libcliproxy.so
          cp dist/android/x86_64/libcliproxy.so android/app/src/main/jniLibs/x86_64/libcliproxy.so
          core_version="${RELEASE_TAG#android-core-v}"
          (
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug -PcoreVersion="$core_version"
          )

      - name: Publish integrated source
        if: steps.sync.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.sync.outputs.release_tag }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git tag -a "$RELEASE_TAG" -m "Android build for CLIProxyAPI ${RELEASE_TAG#android-core-}"
          git push origin "$RELEASE_TAG"

  release:
    name: Build signed Android update
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    uses: ./.github/workflows/android-release.yml
    with:
      source_ref: ${{ needs.sync.outputs.source_ref }}
    secrets: inherit
