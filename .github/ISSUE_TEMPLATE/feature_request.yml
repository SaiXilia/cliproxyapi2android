name: 功能建议 / Feature request
description: 建议 Android 端改进 / Suggest an Android-specific improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请将建议聚焦于 Android 移植版。CLIProxyAPI Core 相关需求更适合提交至上游仓库。

        Please keep requests focused on the Android port. Core CLIProxyAPI requests may belong in the upstream repository.
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题 / Problem to solve
      description: 请说明使用需求或当前限制 / Explain the user need or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为 / Proposed behavior
      description: 请说明你期望的实现方式 / Describe how the feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: 安全确认 / Safety confirmation
      options:
        - label: 此建议不包含凭据或私有配置 / This request contains no credentials or private configuration.
          required: true
