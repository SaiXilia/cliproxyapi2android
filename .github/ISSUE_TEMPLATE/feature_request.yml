name: Feature request
description: Suggest an Android-specific improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please keep requests focused on the Android port. Core CLIProxyAPI requests may belong in the upstream repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety confirmation
      options:
        - label: This request does not contain credentials or private configuration.
          required: true
