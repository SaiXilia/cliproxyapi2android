name: Android 问题反馈 / Bug report
description: 反馈可复现的 Android 应用或集成问题 / Report a reproducible Android issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈。请勿附上 API Key、OAuth 文件、`config.yaml`、`auths/` 中的文件、签名材料或未经脱敏的日志。安全漏洞请按照 `SECURITY.md` 私下报告。

        Thanks for reporting a problem. Do not attach credentials, private configuration, signing material, or unredacted logs. Report security vulnerabilities privately as described in `SECURITY.md`.
  - type: input
    id: app-version
    attributes:
      label: 应用版本 / App version
      placeholder: "例如 / Example: 1.1.2"
    validations:
      required: true
  - type: input
    id: core-version
    attributes:
      label: CLIProxyAPI Core 版本 / Core version
      placeholder: "例如 / Example: 8.0.4"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android 版本与设备 / Android version and device
      placeholder: "例如 / Example: Android 15, Pixel 8, arm64-v8a"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围 / Affected area
      options:
        - 服务生命周期 / Service lifecycle
        - 本地 API 端点 / Local API endpoint
        - 管理控制台 / Management console
        - 身份验证或 OAuth / Authentication or OAuth
        - 应用更新 / App update
        - 用户界面 / User interface
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / What happened?
      description: 请说明预期行为与实际行为 / Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Reproduction steps
      placeholder: |
        1. 打开 / Open ...
        2. 点击 / Tap ...
        3. 观察到 / Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图 / Redacted logs or screenshots
      description: 发布前请移除 Token、账号标识、本地路径及其他隐私数据 / Remove private data before posting.
      render: shell
  - type: checkboxes
    id: confirmation
    attributes:
      label: 安全确认 / Safety confirmation
      options:
        - label: 我已移除凭据和隐私数据 / I removed credentials and private data.
          required: true
        - label: 我确认这不是需要私下报告的安全漏洞 / This is not a security vulnerability requiring private reporting.
          required: true
